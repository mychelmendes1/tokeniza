<div class="modal-container modal-content column gap-8">
    <div class="between">
        <span class="primary-dark fw-700 fs-20">{{ 'auction.modal.auctioNFT' | translate }}</span>
        <mat-icon class="svg-icon primary-gray to-point" svgIcon="close" matDialogClose></mat-icon>
    </div>
    <div class="asset-detail margin-top-30">
        <img class="asset-img" [src]="getMainPhoto(asset)" [alt]="asset.description">
        <div class="asset-info column gap-2">
            <span class="asset-name primary-dark fs-20 fw-700">{{ asset.name }}</span>
            <span class="asset-name primary-off-white-darker fs-16 fw-400">{{ asset.collection.name }}</span>
            <span class="asset-identity primary-off-white-darker fs-13 fw-700">ID: {{ asset.blockchainId }}</span>
        </div>
    </div>
    <div class="input-container margin-top-30">
        <div class="column align-start wth-100 gap-3">
            <label class="label-dark">{{ ('auction.modal.minPrice' | translate) + ' (' + fiatCurrency.currency + ')?' }}</label>
            <input class="input-fill-default medium-border" [placeholder]="fiatCurrency.currency" [(ngModel)]="minimumPrice"
                currencyMask [options]="{ prefix: fiatCurrency.symbol + ' ', precision: 2 }" inputmode="numeric" required
            >
        </div>
    </div>
    <div class="input-container icon-suffix margin-top-20">
        <div class="column align-start wth-100 gap-3">
            <label class="label-dark">{{ 'label.deadline' | translate }}</label>
            <input class="input-fill-default medium-border" [matDatepicker]="pickerInitialDate" [matDatepickerFilter]="dateFilter" [(ngModel)]="deadLine" disabled required>
            <mat-datepicker-toggle matSuffix [for]="pickerInitialDate" class="calendar-icon input-with-label">
                <mat-icon matDatepickerToggleIcon svgIcon="calendar" class="svg-icon primary-dark"></mat-icon>
            </mat-datepicker-toggle>
            <mat-datepicker class="calendar-primary" #pickerInitialDate disabled="false"></mat-datepicker>
        </div>
    </div>
    <div class="cotainer-buttons centered gap-20 margin-top-30">
        <button class="btn doutline wth-100" matDialogClose>{{ 'button.cancel' | translate }}</button>
        <button class="btn dark-shade wth-100" [disabled]="checkValue()" (click)="performTransaction()">
            {{ 'button.auction' | translate }}
        </button>
    </div>
</div>
<mat-progress-spinner *ngIf="loading" class="spinner" [mode]="'indeterminate'"></mat-progress-spinner>
