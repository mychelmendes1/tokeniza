<div class="modal-container modal-content column gap-8">
    <div class="between">
        <span class="primary-dark fw-700 fs-20">{{ 'myAssets.modalSplit.title' | translate }}</span>
        <mat-icon class="svg-icon primary-gray to-point" svgIcon="close" matDialogClose></mat-icon>
    </div>
    <div class="asset-detail margin-top-30">
        <img class="asset-img" [src]="getMainPhoto(asset)" [alt]="asset.description">
        <div class="asset-info column gap-2">
            <span class="asset-name primary-dark fs-20 fw-700">{{ asset.name }}</span>
            <span class="asset-name primary-off-white-darker fs-16 fw-400">{{ asset.collection.name }}</span>
            <span class="asset-identity primary-off-white-darker fs-13 fw-700">ID: {{ asset.blockchainId }}</span>
            <span class="asset-identity primary-off-white-darker fs-13 fw-700" *ngIf="asset?.price > 0">{{ 'myAssets.modalSplit.value' | translate }}: {{ asset?.price }}</span>
        </div>
    </div>
    <div class="input-container margin-top-30 margin-bottom-30">
        <label class="primary-dark fw-700 fs-20">{{ ('myAssets.modalSplit.minimumParts' | translate) }}</label>
        <input type="numeric" class="input-fill-default medium-border" [(ngModel)]="minimumPrice" (input)="newParts()" >
    </div>

    <hr class="margin-bottom-30" *ngIf="minimumPrice">

    <div *ngFor="let part of parts; index as i;" class="input-container">
        <label class="primary-dark fw-700 fs-20">{{ ('myAssets.modalSplit.amount' | translate) + ' ' + (i + 1) + '?' }}</label>
        <input type="numeric" class="input-fill-default medium-border" [(ngModel)]="part.amount">
    </div>

    <div class="cotainer-buttons centered gap-20 margin-top-30">
        <button class="btn doutline wth-100" (click)="closeModal()">{{ 'button.cancel' | translate }}</button>
        <button class="btn dark-shade wth-100" [disabled]="checkValue()" mat-flat-button (click)="performTransaction()">{{ 'myAssets.modalSplit.aution' | translate }}</button>
    </div>
</div>
<mat-progress-spinner *ngIf="loading" class="spinner" [mode]="'indeterminate'"></mat-progress-spinner>
