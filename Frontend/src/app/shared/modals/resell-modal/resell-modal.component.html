<div class="modal-container modal-content column gap-8">
    <div class="between">
        <span class="primary-dark fw-700 fs-20">{{ 'resell.modal.title' | translate }}</span>
        <mat-icon class="svg-icon primary-gray to-point" svgIcon="close" matDialogClose></mat-icon>
    </div>
    <div class="asset-detail margin-top-30">
        <img class="asset-img" [src]="getMainPhoto(asset)" [alt]="asset.description">
        <div class="asset-info column gap-2">
            <span class="asset-name primary-dark fs-20 fw-700">{{ asset.name }}</span>
            <span class="asset-name primary-off-white-darker fs-16 fw-400">{{ asset.collection.name }}</span>
            <span class="asset-identity primary-off-white-darker fs-13 fw-700">ID: {{ asset.blockchainId }}</span>
        </div>
    </div>
    <div class="input-container margin-top-30">
        <div class="column align-start wth-100 gap-3">
            <label class="label-dark text-align-left">{{ ('resell.modal.resellAsk' | translate) + ' (' + fiatCurrency.currency + ')?' }}</label>
            <input class="input-fill-default medium-border" [placeholder]="fiatCurrency.currency" [(ngModel)]="resaleValue"
                currencyMask [options]="{ prefix: fiatCurrency.symbol + ' ', precision: 2 }" inputmode="numeric" required
            >
        </div>
    </div>
    <form [formGroup]="formResell">
        <div class="inline gap-10 margin-top-20">
            <div class="input-container align-start">
                <label class="label-dark">{{ 'resell.modal.resellSpecificUser' | translate }}</label>
                <input class="input-fill-default medium-border" formControlName="email" maxlength="150"
                    [placeholder]="'placeholder.email' | translate" type="email" required
                >
                <span class="error-hint">
                    <ng-container *ngIf="showError('email', formResell) && formResell.get('email')?.hasError('required') && formResell.get('email')?.value">
                        {{ 'errorHint.mandatory' | translate }}
                    </ng-container>
                    <ng-container *ngIf="formResell.get('email')?.invalid && formResell.get('email')?.value">
                        {{ 'errorHint.email' | translate }}
                    </ng-container>
                </span>
            </div>
        </div>
    </form>
    <div class="cotainer-buttons centered gap-20 margin-top-30">
        <button class="btn doutline wth-100" (click)="isEditing ? closeResell() : closeModal()">{{ (isEditing ? 'button.endResale' : 'button.cancel') | translate }}</button>
        <button class="btn dark-shade wth-100" (click)="isEditing ? saveChange() : resellAsset()"
            [disabled]="checkValue() || (formResell.value.email && !formResell.valid)">
            {{ (isEditing ? 'button.saveChange' : 'button.resell') | translate }}
        </button>
    </div>
</div>
<mat-progress-spinner *ngIf="loading" class="spinner" [mode]="'indeterminate'"></mat-progress-spinner>
