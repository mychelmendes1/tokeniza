<div class="modal-container modal-content column gap-8">
    <div class="column gap-20">
        <div class="between">
            <span class="primary-dark fw-700 fs-20">{{ 'Cancelamento de conta' | translate }}</span>
            <mat-icon class="svg-icon primary-gray to-point" svgIcon="close" matDialogClose></mat-icon>
        </div>
        <span class="primary-off-white-darker fw-400 fs-16 text-align-left" [innerHTML]="text"></span>
    </div>

    <div class="input-container margin-top-30">
        <div class="column align-start wth-100 gap-3">
            <label class="label-dark">{{ 'label.type' | translate }}</label>
            <input class="input-fill-default medium-border" [placeholder]="'placeholder.insert' | translate" [(ngModel)]="firstAnswer" [readOnly]="loading">
            <span class="error-hint">
                <ng-container *ngIf="firstAnswer !== answer && firstAnswer">
                    {{ 'errorHint.enterExactlyAsRequested' | translate }}
                </ng-container>
            </span>
        </div>
    </div>
    <div class="container-buttons centered gap-20 margin-top-30">
        <button class="btn dark-shade wth-100" (click)="sendNotification()" [disabled]="!firstAnswer || firstAnswer !== answer || loading">
            {{ 'button.send' | translate }}
        </button>
    </div>
</div>
<mat-progress-spinner *ngIf="loading" class="spinner" [mode]="'indeterminate'"></mat-progress-spinner>
