<div class="bottom-sheet">
    <div class="text">{{ data.text }}</div>
    <div class="buttons-container">
        <button mat-button type="button" (click)="clearBar()">{{ data.declineOption }}</button>
        <button mat-button class="change" type="submit" (click)="confirmOperation()">{{ data.confirmOption }}</button>
        <button mat-button *ngIf="data?.close" class="change" type="submit" (click)="close()">X</button>
    </div>
</div>
